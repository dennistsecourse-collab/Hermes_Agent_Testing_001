<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo</title>
<style>
  :root {
    --bg: #f4f5fa;
    --card: #ffffff;
    --text: #1a1d29;
    --text-2: #6b7280;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --border: #e5e7eb;
    --danger: #ef4444;
    --shadow: 0 10px 40px rgba(26, 29, 41, 0.08);
    --radius: 14px;
  }
  [data-theme="dark"] {
    --bg: #0f1117;
    --card: #1a1d29;
    --text: #f3f4f6;
    --text-2: #9ca3af;
    --accent: #818cf8;
    --accent-soft: #26294a;
    --border: #2a2e3f;
    --danger: #f87171;
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 48px 16px;
    transition: background .3s, color .3s;
  }
  .app {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 32px 28px 24px;
    height: fit-content;
  }
  /* ---------- header ---------- */
  .head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.4px; }
  .date { color: var(--text-2); font-size: 13px; margin-top: 4px; }
  .theme-btn {
    background: var(--accent-soft);
    border: none;
    width: 38px; height: 38px;
    border-radius: 50%;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: var(--accent);
    transition: transform .2s, background .3s;
    flex-shrink: 0;
  }
  .theme-btn:hover { transform: scale(1.08); }
  .theme-btn svg { width: 18px; height: 18px; }

  .progress {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0 22px;
  }
  .bar {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 99px;
    transition: width .35s ease;
  }
  .pct { font-size: 12px; color: var(--text-2); min-width: 64px; text-align: right; }

  /* ---------- input ---------- */
  .add-row { display: flex; gap: 10px; margin-bottom: 18px; }
  #todo-input {
    flex: 1;
    border: 1.5px solid var(--border);
    background: transparent;
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 15px;
    color: var(--text);
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  #todo-input::placeholder { color: var(--text-2); }
  #todo-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  #add-btn {
    width: 48px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    transition: filter .2s, transform .15s;
  }
  #add-btn:hover { filter: brightness(1.1); }
  #add-btn:active { transform: scale(.95); }

  /* ---------- list ---------- */
  ul { list-style: none; }
  li.todo {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    margin-bottom: 10px;
    animation: pop .25s ease;
    transition: background .2s, opacity .2s;
  }
  li.todo:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
  @keyframes pop {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .check {
    width: 22px; height: 22px;
    border: 2px solid var(--border);
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    transition: all .2s;
    padding: 0;
  }
  .check svg { width: 12px; height: 12px; stroke: #fff; opacity: 0; transition: opacity .15s; }
  li.done .check { background: var(--accent); border-color: var(--accent); }
  li.done .check svg { opacity: 1; }
  .txt {
    flex: 1;
    font-size: 15px;
    line-height: 1.4;
    word-break: break-word;
    transition: color .2s;
  }
  li.done .txt { color: var(--text-2); text-decoration: line-through; }
  .del {
    border: none;
    background: transparent;
    color: var(--text-2);
    cursor: pointer;
    width: 32px; height: 32px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    opacity: 0;
    transition: all .15s;
    flex-shrink: 0;
  }
  li:hover .del { opacity: 1; }
  .del:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
  .del svg { width: 17px; height: 17px; }

  .empty {
    text-align: center;
    color: var(--text-2);
    padding: 40px 0 30px;
    display: none;
  }
  .empty .icon { font-size: 34px; margin-bottom: 10px; }
  .empty p { font-size: 14px; }

  /* ---------- footer ---------- */
  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .count { font-size: 13px; color: var(--text-2); }
  .filters { display: flex; gap: 4px; background: var(--bg); border-radius: 10px; padding: 3px; }
  .filters button {
    border: none;
    background: transparent;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-2);
    cursor: pointer;
    transition: all .15s;
  }
  .filters button.on { background: var(--card); color: var(--accent); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .clear {
    border: none;
    background: transparent;
    color: var(--text-2);
    font-size: 13px;
    cursor: pointer;
    padding: 6px 8px;
    border-radius: 8px;
    transition: all .15s;
  }
  .clear:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
  .clear[hidden] { display: none; }

  @media (hover: none) { .del { opacity: .6; } }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div>
      <h1>Todo</h1>
      <div class="date" id="date"></div>
    </div>
    <button class="theme-btn" id="theme-btn" title="切換主題" aria-label="切換主題"></button>
  </div>

  <div class="progress">
    <div class="bar"><i id="bar"></i></div>
    <span class="pct" id="pct">0% 完成</span>
  </div>

  <div class="add-row">
    <input id="todo-input" type="text" placeholder="新增待辦事項…" maxlength="200" autofocus>
    <button id="add-btn" aria-label="新增">+</button>
  </div>

  <ul id="list"></ul>

  <div class="empty" id="empty">
    <div class="icon">🌤️</div>
    <p id="empty-msg">沒有待辦事項，新增一個吧</p>
  </div>

  <div class="foot">
    <span class="count" id="count"></span>
    <div class="filters" id="filters">
      <button data-f="all" class="on">全部</button>
      <button data-f="active">未完成</button>
      <button data-f="done">已完成</button>
    </div>
    <button class="clear" id="clear-done" hidden>清除已完成</button>
  </div>
</div>

<script>
(() => {
  const LS_TODOS = "todos.v1";
  const LS_THEME = "theme.v1";

  let todos = JSON.parse(localStorage.getItem(LS_TODOS) || "[]");
  let filter = "all";

  const $ = id => document.getElementById(id);
  const list = $("list"), input = $("todo-input");

  // ---------- theme ----------
  const sun = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const moon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    $("theme-btn").innerHTML = t === "dark" ? sun : moon;
    localStorage.setItem(LS_THEME, t);
  }
  setTheme(localStorage.getItem(LS_THEME) || "light");
  $("theme-btn").onclick = () =>
    setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

  // ---------- date ----------
  $("date").textContent = new Date().toLocaleDateString("zh-Hant",
    { weekday: "long", year: "numeric", month: "long", day: "numeric" });

  // ---------- helpers ----------
  const save = () => localStorage.setItem(LS_TODOS, JSON.stringify(todos));
  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
  const ICON_DEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';

  function render() {
    const shown = todos.filter(t =>
      filter === "all" ? true : filter === "active" ? !t.done : t.done);
    list.innerHTML = "";
    for (const t of shown) {
      const li = document.createElement("li");
      li.className = "todo" + (t.done ? " done" : "");
      li.dataset.id = t.id;

      const chk = document.createElement("button");
      chk.className = "check";
      chk.innerHTML = ICON_CHECK;
      chk.setAttribute("aria-label", "標記完成");
      chk.onclick = () => toggle(t.id);

      const span = document.createElement("span");
      span.className = "txt";
      span.textContent = t.text;

      const del = document.createElement("button");
      del.className = "del";
      del.innerHTML = ICON_DEL;
      del.setAttribute("aria-label", "刪除");
      del.onclick = () => remove(t.id);

      li.append(chk, span, del);
      list.appendChild(li);
    }

    const total = todos.length, done = todos.filter(t => t.done).length;
    const pct = total ? Math.round(done / total * 100) : 0;
    $("bar").style.width = pct + "%";
    $("pct").textContent = `${pct}% 完成`;
    $("count").textContent = total
      ? `剩餘 ${total - done} 項未辦`
      : "全部完成 🎉";
    $("empty").style.display = total ? "none" : "block";
    $("empty-msg").textContent = total
      ? (filter === "active" ? "沒有未完成的待辦"
         : filter === "done" ? "還沒有已完成的待辦"
         : "沒有待辦事項，新增一個吧")
      : "沒有待辦事項，新增一個吧";
    $("clear-done").hidden = done === 0;
  }

  function add() {
    const text = input.value.trim();
    if (!text) return;
    todos.push({ id: Date.now() + Math.random().toString(36).slice(2), text, done: false });
    input.value = "";
    save(); render();
    input.focus();
  }
  function toggle(id) {
    const t = todos.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }
  function remove(id) {
    todos = todos.filter(t => t.id !== id);
    save(); render();
  }

  $("add-btn").onclick = add;
  input.addEventListener("keydown", e => { if (e.key === "Enter") add(); });
  $("clear-done").onclick = () => { todos = todos.filter(t => !t.done); save(); render(); };
  $("filters").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    filter = b.dataset.f;
    [...$("filters").children].forEach(x => x.classList.toggle("on", x === b));
    render();
  });

  render();
})();
</script>
</body>
</html>
