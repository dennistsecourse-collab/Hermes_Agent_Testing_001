# Build & deploy the static Todo app to GitHub Pages.
# Model: classic "Deploy from a branch" — the built site/ is published to a
# `gh-pages` branch, which GitHub Pages serves. Self-contained: no
# actions/configure-pages (which 404s until a Pages site exists).
name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # needed to push the gh-pages branch from the workflow

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: |
          set -euo pipefail
          # self-contained single-file app: index.html is the whole site
          mkdir -p site
          cp index.html site/index.html
          # 404 fallback so sub-paths don't break the app
          cp site/index.html site/404.html
          echo "Deploying: $(ls site | tr '\n' ' ')"

      - name: Deploy to gh-pages branch
        uses: JamesIves/gh-pages-deploy-action@v1
        with:
          branch: gh-pages
          folder: site
          clean: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
