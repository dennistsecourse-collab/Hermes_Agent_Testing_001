# Deploy the static Todo app to GitHub Pages.
#
# Model: "Deploy from GitHub Actions" (the official artifact pipeline that
# GitHub scaffolds when you pick GitHub Actions as the Pages source).
#   build  : checkout -> configure-pages -> build into docs/ -> upload artifact
#   deploy : actions/deploy-pages publishes the artifact to the Pages site.
#
# Uses only official actions/* — no third-party marketplace actions, no manual
# branch pushes. GITHUB_TOKEN carries the `pages`/`id-token` write permissions
# set below, so the deploy works even where the contributor's PAT lacks access.
name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: |
          set -euo pipefail
          # self-contained single-file app: index.html is the whole site
          mkdir -p docs
          cp index.html docs/index.html
          cp index.html docs/404.html   # any path still loads the app
          echo "Deploying: $(ls docs | tr '\n' ' ')"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
