# Build and deploy the static Todo app to GitHub Pages.
# Triggered on every push to `main` and on manual dispatch.
# - Build job: assembles the deployable site/ artifact (here a self-contained
#   index.html; swap in a real bundler step later if the app grows).
# - Deploy job: pushes the artifact to GitHub Pages via the standard
#   actions/deploy-pages + environment (recommended, replaces the old
#   `pjax`/`aws` workflow).
name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Pages requires these permissions on the GITHUB_TOKEN.
permissions:
  contents: write
  pages: write
  id-token: write

# Only one deploy in flight; a newer push supersedes an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        id: pages

      - name: Build site
        run: |
          set -euo pipefail
          mkdir -p site
          # Self-contained app: ship index.html as the entry point.
          cp index.html site/index.html
          echo "Deploy target: site/ ($(ls site | tr '\n' ' '))"

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
